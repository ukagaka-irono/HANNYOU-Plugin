# 汎用プラグイン（HANNYOU Plugin） - Knights Editor 設定

# 役職の作成・編集・削除などをサーバーのログと OP のチャットに記録する
log-role-changes: true

settings:
  # 登録できる役職の最大数 (-1 = 無制限)
  max-roles: -1
  # 参加時に役職の装備・インベントリを再配布する (false の場合はポーション効果のみ再適用)
  reapply-items-on-join: true

# ウデマエ
udemae:
  # ランクの名前（下から順に）。はじめての人はいちばん下の 0 ポイントから始まる
  ranks: [C-, C, C+, B-, B, B+, A-, A, A+, S, S+]
  # 1つのランクの中のポイント。これに届くと次のランクに上がる
  points-per-rank: 100
  # 合計ポイントを書き出すスコアボードのスコアの名前（RandomTeam などがチーム分けで読む）。空にすると書き出さない
  export-objective: udemae
  # 試合中の判定。このスコアの値が value のときだけウデマエを数える
  match:
    objective: hannyou_match
    # 空なら、プレイヤーごとのスコアを見る（その人が試合中か）。#game などを書くと、その持ち主のスコアを見る（今が試合中か）
    holder: ""
    value: 1
  # 勝ち・負けのスコア（0 から 0 以外に変わったときに一度だけ数える）
  win-objective: _game_win
  lose-objective: _game_lose
  # 倒される前の何秒以内にダメージを与えていたらアシストにするか
  assist-seconds: 10
  # 占領の判定。占領はデータパック（cok_area）が管理するので、データパックと同じ条件で見る:
  # phase-objective の phase-holder の値が今の拠点の番号（0 = 1つ目）で、team の人がその拠点の radius ブロック以内にいれば占領中
  capture:
    phase-objective: area_manage
    phase-holder: phase
    team: atk
    # 拠点のあるワールド（空ならメインのワールド）
    world: ""
    radius: 2
    # 拠点の座標（上から1つ目、2つ目…）。データパックの main.mcfunction と同じ座標にする
    points:
      - [-118, 69, -154]
      - [-64, 74, -266]
      - [-48, 75, -132]
      - [17, 82, -147]
    # 占領地に何秒いるごとに capture-stay のポイントを入れるか
    stay-seconds: 5
  # 行動ごとのポイント（仮の数字。マイナスにすると減る）
  points:
    melee-kill: 10              # 近接武器でキル
    melee-assist: 5             # 近接武器でアシスト
    ranged-kill: 12             # 遠距離武器で射抜いてキル
    ranged-assist: 6            # 遠距離武器で射抜いてアシスト
    soldier-melee-kill: 6       # スポーンエッグで出した兵士が近接でキル
    soldier-melee-assist: 3
    soldier-ranged-kill: 6      # スポーンエッグで出した兵士が遠距離でキル
    soldier-ranged-assist: 3
    mob-soldier-kill: 3         # ほかの人のモブ兵士をキル
    mob-soldier-assist: 1
    capture-stay: 2             # 占領地に capture.stay-seconds 秒いるごと
    capture-kill: 15            # 占領中にプレイヤーをキル（キルの点に上乗せ）
    capture-assist: 7           # 占領中にプレイヤーをアシスト（アシストの点に上乗せ）
    win: 30                     # 試合に勝つ
    death: 0                    # 倒される
    lose: 0                     # 試合に負ける
